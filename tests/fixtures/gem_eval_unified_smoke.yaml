# Fixture: both gem_eval and tau2_eval sections in one file. Each loader
# should read its own section independently without interfering with
# the other.
gem_eval:
  defaults:
    episodes: 2
    max_turns: 10
    temperature: 1.0
    max_tokens: 2048
    max_concurrent: 4

  tasks:
    - task_id: "rg:graph_color-easy"
      episodes: 2
      max_turns: 8

tau2_eval:
  defaults:
    max_concurrency: 4
    num_trials: 1
    max_steps: 30
    agent_temperature: 1.0
    agent_max_tokens: 1024
    user_llm: "openrouter/openai/gpt-5-mini"
    user_temperature: 0.0
    user_max_tokens: 1024

  tasks:
    - domain: retail
      split: test
      truncate: 1
