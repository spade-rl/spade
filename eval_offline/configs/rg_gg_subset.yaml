# Selection rule and what may NOT be claimed from it:
#   eval_offline/configs/rg_hard_split.README.md
# Use games.yaml (all 100 rg:*-hard) for anything compared against
# reasoning_gym's or Golden Goose's published numbers, or for base-vs-finetune
# deltas.
