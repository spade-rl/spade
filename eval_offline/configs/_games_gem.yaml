# RG hard split (RQ1 "Games" table) — all 100 reasoning_gym tasks of the
# canonical hard split (reasoning_gym paper arXiv:2505.24760, Appendix A.3),
# enumerated individually. Grouped below by Golden Goose category for
# readability only: the four reported columns (Math / Algorithmic / Cognition /
# Logic) are rolled up by gem_evaluator via RG_GOLDEN_GOOSE and emitted as
# gem_eval/category_rg_<bucket>/win_rate. The bucket names themselves are NOT
# registered environments, so they must never appear as task_ids here.
#
# Per-task episodes/turns/sampling mirror the settings used for the paper runs.
gem_eval:
  defaults:
    episodes: 8
    max_turns: 2
    temperature: 0.6
    max_tokens: 8192
    max_concurrent: 64

  tasks:
    # ---- Math (31 tasks) ----
