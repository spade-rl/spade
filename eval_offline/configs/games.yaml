# Paper evaluation protocol ("Games" tables). ONE config, four benchmarks:
#   AIME 2025/2026     Avg@32   temp 0.7 / top_p 0.8 / top_k 20
#   GPQA-Diamond       Avg@10   Qwen3 TR protocol, via GEM
#   LiveCodeBench-v6   Pass@1   full 175-problem release_v6 (25.02..25.05), via GEM
#   Reasoning-Gym      Avg@8    100-task hard split (4 categories), via GEM
#
# GPQA/LCB/RG run through spade.core.eval (GemEvaluator), the same code path
# used for the reported runs. LCB requires LCB_OFFICIAL_DIR + LCB_V6_JSONL.
suites:
  aime:
    concurrent: true
    years: [2025, 2026]
    n_samples_per_prompt: 32
    temperature: 0.7
    top_p: 0.8
    top_k: 20
    max_tokens: 32768

  gem:
    defaults:
      episodes: 8
      max_turns: 2
      temperature: 0.6
      max_tokens: 32768
      max_concurrent: 64
    tasks:
      # GPQA-Diamond: Avg@10 per the Qwen3 Tech Report ("we sample 10 times for
      # each query and report the averaged accuracy"). episodes = 1980 = 10 x 198:
      # the evaluator seeds reset() with the episode index, so every Diamond
      # question is answered exactly 10 times.
      - { task_id: "mcq:GPQA-Diamond-official", episodes: 1980, seed: 42, temperature: 0.7, max_tokens: 32768 }

      # LiveCodeBench-v6: Pass@1 over the full 175-problem release_v6 dump
      # (25.02..25.05, per the Qwen3 model-card window), each problem exactly
      # once, official lcb_runner harness
      # end to end. Requires LCB_OFFICIAL_DIR + LCB_V6_JSONL at runtime.
      - { task_id: "eval:LiveCodeBench-v6", episodes: 175, seed: 42, temperature: 0.7, max_tokens: 32768 }

